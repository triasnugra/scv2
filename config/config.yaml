# Konfigurasi Mesin Analisis Scalping.
# [E] = aturan dari metodologi Eliz (angka = acuan yang dia sebut)
# [C] = parameter hipotesis dari perancang. BELUM TERBUKTI sebelum backtest/forward-test.
mode: paper                     # paper | analysis. Tidak ada auto-eksekusi.
account_equity: 1000            # hanya untuk hitung qty/notional di output
symbols: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT, DOGEUSDT, LINKUSDT, AVAXUSDT]
btc_symbol: BTCUSDT
major_symbols: [BTCUSDT, ETHUSDT]
obv_symbols: [BTCUSDT, ETHUSDT]  # [E] OBV hanya BTC/ETH, 1D

data:
  providers: [binance_vision, binance, okx, bybit]   # urutan fallback (GitHub runner AS sering kena 451 di binance.com)
  counts: {5m: 600, 15m: 500, 1H: 500, 4H: 300, 1D: 300}
  timeout: 20
  orderbook: true               # opsional; bila gagal mesin lanjut tanpa (skor dikurangi)

costs: {fee_pct: 0.05, slippage_pct: 0.02, spread_pct: 0.01}   # [C] per sisi (fee, slippage); spread sekali

g0:                             # Gate 0 - data & kelayakan
  min_bars: {5m: 120, 15m: 120, 1H: 120, 4H: 80, 1D: 60}
  max_stale_bars: 2
  gap_check_bars: 60
  max_gaps_recent: 0
  max_zero_vol_frac: 0.05
  min_quote_vol_24h: 30000000   # [C] USDT; tolak koin tipis
  scam_pump_pct: 30             # [E] tolak pump terisolasi; angka [C]; hanya non-major

g1:                             # Gate 1 - konteks waktu & event
  events_file: config/events.yaml
  event_before_min: 90          # [C]
  event_after_min: 60           # [C]
  weekly_close_window_min: 90   # [C]
  monthly_close_window_min: 180 # [C]
  thin_ratio: 0.45              # [C] volume 6 jam terakhir / rata-rata 7 hari
  thin_ratio_weekend: 0.70      # [C]
  shock_pct: {major: 10, alt: 15}      # [E] +-10-15% sehari; angka per kelas [C]
  flash_bar_pct: {major: 5, alt: 8}    # [C] range 1 candle 1H
  shock_stand_aside_hours: 24   # [E] tunggu 24-48 jam
  shock_restrict_hours: 48
  monday_min_confluence: 3      # [E] Monday range: hanya level penting
  monday_max_trades_per_hour: 2 # [E] maksimal 1-2/jam

g2:                             # Gate 2 - musim
  w_1d: 2
  w_4h: 1
  threshold: 3                  # [C] |skor| >= ini => musim
  pivot_k: 3
  weekly_support_tol_pct: 1.0   # [C] BTC dekat support mingguan => dilarang short
  allow_counter_trend: true     # hanya T1/T2, konfirmasi >= 2, risiko x0.5

g3:                             # Gate 3 - rezim & lokasi
  range_lookback: {1H: 72, 4H: 60}
  range_exclude_recent: 3       # candle terbaru tidak dipakai mendefinisikan range (agar deviasi tak merusak range)
  pivot_k: 2
  touch_tol_pct: {1H: 0.40, 4H: 0.60}   # [C]
  min_height_pct: 0.8
  max_height_pct: 7.0           # lebih lebar = bukan range scalp
  edge_pct: 20                  # zona tepi = 20% tinggi range dari RH/RL
  mid_lo: 40                    # [E] tengah range = NO_TRADE; angka 40-60 [C]
  mid_hi: 60

g4:                             # Gate 4 - peta level
  near_tol_pct: 0.30            # [C] jarak "dekat level"
  window_pct: 8.0
  fib_ratios: [0.25, 0.5, 0.75, 0.786]   # [E]
  fvg_min_pct: 0.15
  imp_atr: 1.5                  # [C] candle impulsif untuk demand/supply
  swing_k: 3

triggers:
  t1:                           # Deviation + Reclaim (utama)
    tfs: ["5m", "15m", "1H"]
    reclaim_bars: 3             # [C] N candle (1-3)
    lookback_bars: 12
    sweep_min_pct: 0.03
    sweep_max_pct: 1.5          # lebih dalam = breakdown, bukan sweep
    stop_buf_atr: 0.15
    chase_atr: 1.0              # lebih jauh dari ini = tunggu retest (PENDING)
    max_age_bars: 8
    wick_frac: 0.5
    level_window_pct: 2.0
  t2:                           # Breakout -> Retest
    tfs: ["1H", "4H"]
    lookback_bars: 16
    vol_mult: 1.3               # [E] break dengan volume (di atas rata-rata); angka [C]
    min_consol: 2               # [E] 2-3 candle konsolidasi
    retest_tol_pct: 0.25
    max_age_bars: 12
    fake_reclaim_bars: 12       # breakout gagal => dievaluasi sebagai T1 arah sebaliknya
    stop_buf_atr: 0.15
  t3:                           # Pullback Fibonacci
    impulse_tfs: ["1H", "4H"]
    trigger_tf: 15m
    pivot_k: 3
    min_impulse_pct: 1.5
    impulse_back: 60
    zone_tol_pct: 0.15
    recent_bars: 6
    chase_atr: 1.0
    stop_buf_atr: 0.15
  t4:                           # Reclaim trendline / flip EMA
    tfs: ["1H"]
    ema_periods: [20, 50]
    lookback_bars: 12
    pre_below_bars: 3
    retest_tol_pct: 0.20
    pivot_k: 3
    min_line_sep: 6
    stop_buf_atr: 0.15

g6:                             # Gate 6 - konfirmasi (tidak menggantikan trigger)
  min_confirmations: 1
  counter_trend_min: 2
  volume_spike_mult: 1.5
  use_orderbook: true
  wall_mult: 8.0                # dinding = qty >= 8x median
  wall_tol_pct: 0.40
  btc_bars: 6
  btc_align_pct: 0.10
  btc_veto_pct: 0.50

g7:                             # Gate 7 - invalidasi & R:R
  max_stop_pct_major: 2.0       # [E] BTC/ETH lebih rapat; angka [C]
  max_stop_pct_alt: 4.0         # [E] acuan altcoin 2-5%; "berleverage 2-4% tidak lebih"
  min_stop_pct: 0.15            # [C] terlalu rapat = habis dimakan biaya
  min_rr_tp1: 1.0               # [C] setelah fee+slippage
  min_rr_tp2: 2.0               # [C]
  tp_min_atr_1h: 0.5            # [C] target minimal 0.5 ATR(1H) dari entry
  tp2_max_pct: 6.0
  tp_buffer_pct: 0.05           # target sedikit sebelum level
  risk_pct: 0.75                # [C] 0.5-1% ekuitas
  max_leverage: 5               # [C]
  tp1_fraction: 0.6             # [C] ambil 50-70% di TP1, lalu stop ke BE

g8:                             # Gate 8 - skor
  weights: {trend: 20, location: 15, confluence: 15, trigger: 20, confirm: 10, rr: 15, market: 5}
  trade_min: 75
  wait_min: 60
  optional_missing_penalty: 3

limits:                         # batas harian [C]
  max_trades_day: 3
  max_daily_loss_r: 2.5
  pause_after_losses: 2
  pause_hours: 4

sim:                            # simulator paper-trade & backtest
  entry_expiry_bars: 24         # bar 5m sebelum limit order dibatalkan
  time_stop_bars: 36            # 3 jam tanpa TP1 => keluar
  max_hold_bars: 72             # 6 jam maksimum (dilarang jadi swing)

backtest:
  symbols: [BTCUSDT, ETHUSDT, SOLUSDT]
  days: 60
  step: 15m
  folds: 4
  workers: 2
  min_trades_significance: 100
