name: Scan & Deploy
on:
  schedule: [{cron: "*/5 * * * *"}]   # best-effort; bisa tertunda. Repo privat: ganti ke */15 agar hemat menit
  workflow_dispatch:
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: scalp-state, cancel-in-progress: false}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Ambil state (branch data) & hasil backtest
        run: |
          REPO="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then git clone --depth 1 --branch data "$REPO" state; else mkdir state; fi
          if git ls-remote --exit-code --heads origin backtest >/dev/null 2>&1; then git clone --depth 1 --branch backtest "$REPO" state_bt; fi
      - name: Scan
        env: {TELEGRAM_BOT_TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}", TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}"}
        run: python scripts/run_scan.py
      - name: Simpan state (1 commit, force-push)
        run: |
          cd state && rm -rf .git && git init -q -b data && git config user.name "scalp-bot" && git config user.email "bot@users.noreply.github.com"
          git add -A && git commit -qm "state $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
