name: Backtest
on:
  workflow_dispatch:
    inputs:
      days: {description: "Jumlah hari", default: "60"}
  schedule: [{cron: "0 3 * * 0"}]
permissions: {contents: write}
jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python scripts/run_backtest.py --days ${{ github.event.inputs.days || 60 }} --out reports
      - run: cat reports/backtest.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: {name: backtest, path: reports}
      - name: Publikasikan ke branch backtest (dibaca workflow Scan)
        run: |
          cd reports && git init -q -b backtest && git config user.name "scalp-bot" && git config user.email "bot@users.noreply.github.com"
          git add -A && git commit -qm "backtest $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" backtest
